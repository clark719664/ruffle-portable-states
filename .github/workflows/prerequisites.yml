name: Restricted interactive SWF process checkpoint
on: [workflow_dispatch]
permissions:
  contents: read
jobs:
  checkpoint:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.0'
      - name: Fetch exact upstream base and apply patch
        shell: pwsh
        run: |
          git init work/ruffle
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C work/ruffle remote add origin https://github.com/ruffle-rs/ruffle.git
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C work/ruffle fetch --depth 1 origin 045db00b393aed22a462d29cb6c25efa26be90a0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C work/ruffle checkout --detach FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C work/ruffle apply --check ../../portable-avm1-checkpoint.patch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C work/ruffle apply ../../portable-avm1-checkpoint.patch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: All 17 selected process-checkpoint and prerequisite tests
        working-directory: work/ruffle
        shell: pwsh
        env:
          RUFFLE_PORTABLE_EXPORT: ${{ runner.temp }}/checkpoint-demo
        run: |
          cargo test -p ruffle_core --lib portable_snapshot --no-default-features -j 1 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/checkpoint-tests.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Select-String -LiteralPath "$env:RUNNER_TEMP/checkpoint-tests.log" -SimpleMatch 'test result: ok. 17 passed; 0 failed;')) { throw 'Expected 17 selected tests did not run successfully.' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: restricted-checkpoint-demo-and-tests
          path: |
            ${{ runner.temp }}/checkpoint-demo/
            ${{ runner.temp }}/checkpoint-tests.log
